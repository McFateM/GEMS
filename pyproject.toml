[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gems"
version = "0.1.0"
description = "Gather, export, map, and serialize Alma Digital / Specto records for CollectionBuilder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
desktop = ["flet==0.25.2", "flet-desktop==0.25.2"]
web = ["flet==0.25.2", "flet-web==0.25.2", "fastapi<0.145"]

[tool.setuptools.packages.find]
include = ["gems*"]
