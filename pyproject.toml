[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gems"
version = "0.1.0"
description = "Gather, export, map, and serialize Alma Digital / Specto records for CollectionBuilder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flet==0.25.2",
  "flet-desktop==0.25.2",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
]

[tool.setuptools.packages.find]
include = ["gems*"]
